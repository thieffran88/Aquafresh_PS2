name: Build PS2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes das regras
        run: make test

  ps2:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependencias
        run: apk add --no-cache make xorriso
      - uses: actions/checkout@v4
      - name: Compilar ELF e ISO
        run: make all packed iso
      - uses: actions/upload-artifact@v4
        with:
          name: AquafreshPS2
          path: |
            aquafresh.elf
            aquafresh-packed.elf
            aquafresh.iso
