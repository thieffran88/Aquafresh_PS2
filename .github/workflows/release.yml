name: Release

# Publica um release com o ELF (e a ISO) sempre que o arquivo VERSION muda
# (ou manualmente). A tag vX.Y.Z e criada pelo proprio release.
on:
  push:
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependencias
        run: apk add --no-cache make xorriso
      - uses: actions/checkout@v4
      - name: Compilar ELF e ISO
        run: |
          make all packed iso
          mkdir -p out
          cp aquafresh-packed.elf out/AquafreshPS2.elf
          cp aquafresh.iso out/AquafreshPS2.iso
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \n' < VERSION)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ja existe: atualizando os arquivos"
            gh release upload "$TAG" out/AquafreshPS2.elf out/AquafreshPS2.iso \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/AquafreshPS2.elf out/AquafreshPS2.iso \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Aquafresh PS2 $TAG" \
              --notes-file .github/release_notes.md
          fi
